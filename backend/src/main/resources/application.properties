spring.application.name=3dmarket-backend
server.port=8080

# Configuración de Base de Datos:
# Si SPRING_DATASOURCE_URL está definido (por ejemplo, en Docker), usa MariaDB.
# Si no, usa H2 en memoria para arranque local instantáneo.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:market3d_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# Consola H2 para inspección rápida en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Límite de tamaño de subida de archivos 3D (.glb, .gltf, .zip)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Directorio de almacenamiento para archivos 3D
app.upload.dir=uploads

services:
  mariadb:
    image: mariadb:11.4
    container_name: 3dmarket-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: market3d_db
      MYSQL_USER: user3d
      MYSQL_PASSWORD: password3d
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - 3dmarket-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: 3dmarket-backend
    restart: always
    depends_on:
      - mariadb
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/market3d_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: user3d
      SPRING_DATASOURCE_PASSWORD: password3d
      SPRING_DATASOURCE_DRIVER: org.mariadb.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      APP_UPLOAD_DIR: /app/uploads
    ports:
      - "8081:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - 3dmarket-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: 3dmarket-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - 3dmarket-network

volumes:
  mariadb_data:
  uploads_data:

networks:
  3dmarket-network:
    driver: bridge
